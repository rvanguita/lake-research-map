<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="530" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">lake-research-map: bibliographic medallion pipeline</text>

  <!-- sources -->
  <g>
    <rect x="90" y="42" width="220" height="46" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="70" text-anchor="middle" font-size="14" fill="#1e293b">IEEE Xplore</text>

    <rect x="420" y="42" width="220" height="46" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
    <text x="530" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">OpenAlex REST API</text>
    <text x="530" y="80" text-anchor="middle" font-size="12" fill="#15803d">citations &amp; references</text>

    <rect x="750" y="42" width="220" height="46" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="860" y="65" text-anchor="middle" font-size="14" fill="#1e293b">Elsevier /</text>
    <text x="860" y="80" text-anchor="middle" font-size="14" fill="#1e293b">ScienceDirect</text>
  </g>

  <!-- arrows from sources down into pipeline -->
  <path d="M200,88 L200,116 L120,116 L120,130" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M530,88 L530,116 L284,116 L284,130" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M860,88 L860,116 L120,116" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- pipeline stages -->
  <g font-size="12">
    <!-- raw -->
    <rect x="50" y="130" width="140" height="76" rx="8" fill="#e2f0e5" stroke="#166534" stroke-width="1.5"/>
    <text x="120" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">raw</text>
    <text x="120" y="170" text-anchor="middle" fill="#14532d">verbatim ingestion</text>
    <text x="120" y="185" text-anchor="middle" fill="#14532d">CSV, .bib, PDF</text>
    <text x="120" y="200" text-anchor="middle" fill="#14532d">hash inventory</text>

    <!-- bronze -->
    <rect x="214" y="130" width="140" height="76" rx="8" fill="#f4e6d7" stroke="#92400e" stroke-width="1.5"/>
    <text x="284" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">bronze</text>
    <text x="284" y="170" text-anchor="middle" fill="#78350f">IEEE + Elsevier</text>
    <text x="284" y="185" text-anchor="middle" fill="#78350f">unioned schema</text>
    <text x="284" y="200" text-anchor="middle" fill="#78350f">OpenAlex enriched</text>

    <!-- silver -->
    <rect x="378" y="130" width="140" height="76" rx="8" fill="#e2e8f4" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="448" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">silver</text>
    <text x="448" y="170" text-anchor="middle" fill="#1e3a8a">dedup by DOI,</text>
    <text x="448" y="185" text-anchor="middle" fill="#1e3a8a">quality-flagged,</text>
    <text x="448" y="200" text-anchor="middle" fill="#1e3a8a">fuzzy PDF linked</text>

    <!-- gold -->
    <rect x="542" y="130" width="140" height="76" rx="8" fill="#f6e8ee" stroke="#9d174d" stroke-width="1.5"/>
    <text x="612" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">gold</text>
    <text x="612" y="170" text-anchor="middle" fill="#831843">curated articles</text>
    <text x="612" y="185" text-anchor="middle" fill="#831843">+ RAG-ready</text>
    <text x="612" y="200" text-anchor="middle" fill="#831843">reconciled chunks</text>

    <!-- embed -->
    <rect x="706" y="130" width="140" height="76" rx="8" fill="#ede7f6" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="776" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">embed</text>
    <text x="776" y="170" text-anchor="middle" fill="#4c1d95">binary float32</text>
    <text x="776" y="185" text-anchor="middle" fill="#4c1d95">local fastembed</text>
    <text x="776" y="200" text-anchor="middle" fill="#4c1d95">(bge-small-en)</text>

    <!-- semantic -->
    <rect x="870" y="130" width="140" height="76" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="940" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">semantic</text>
    <text x="940" y="170" text-anchor="middle" fill="#0369a1">contrastive margin</text>
    <text x="940" y="185" text-anchor="middle" fill="#0369a1">KMeans &amp; 2D maps</text>
    <text x="940" y="200" text-anchor="middle" fill="#0369a1">duplicate pairs</text>
  </g>

  <!-- arrows between stages -->
  <path d="M190,168 L214,168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M354,168 L378,168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M518,168 L542,168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M682,168 L706,168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M846,168 L870,168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- orchestration bracket -->
  <path d="M50,222 L1010,222" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M120,206 L120,222 M284,206 L284,222 M448,206 L448,222 M612,206 L612,222 M776,206 L776,222 M940,206 L940,222"
        fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="530" y="242" text-anchor="middle" font-size="13" fill="#475569">orchestrated by Apache Airflow — one DAG per stage, chained end-to-end</text>

  <!-- arrow down to dashboard -->
  <path d="M530,250 L530,280" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dashboard -->
  <rect x="230" y="286" width="600" height="84" rx="8" fill="#fff7e6" stroke="#92400e" stroke-width="1.5"/>
  <text x="530" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Streamlit Analytical Research Dashboard (10 pages)</text>
  <text x="530" y="332" text-anchor="middle" font-size="13" fill="#78350f">scientometrics, econometrics, methodological synthesis, technological frontiers,</text>
  <text x="530" y="350" text-anchor="middle" font-size="13" fill="#78350f">Bass diffusion, semantic drift, bibliometric laws &amp; hybrid BM25 + vector RAG search</text>
</svg>
