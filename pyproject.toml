[project]
name = "lake-research-map"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Medallion data lake and analytical research platform turning IEEE Xplore and Elsevier bibliographic exports into a deduplicated, RAG-ready literature corpus"
readme = "README.md"
authors = [
    { name = "Rene", email = "renevajr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.1",
    "fastembed>=0.8.0",
    "mcp>=2.3.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pymysql>=1.2.0",
    "pypdf>=7.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.20.0",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.0",
    "sqlalchemy>=2.0.53",
    "statsmodels>=0.14.5",
    "streamlit>=1.63.0",
    "tokenizers>=0.23.2",
]

[project.scripts]
lake-research-map = "cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The code sits directly under src/ as several top-level packages and modules
# rather than one lake_research_map package. uv_build only packages directories,
# not single-file modules such as config.py, hence hatchling.
sources = ["src"]
only-include = [
    "src/apps",
    "src/cli",
    "src/db",
    "src/devtools",
    "src/ingest",
    "src/transform",
    "src/config.py",
    "src/pipeline.py",
    "src/quality.py",
    "src/runs.py",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Dashboard pages carry long human-readable (English) UI captions and help text;
# enforcing a hard wrap on those hurts readability more than it helps.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
markers = [
    "mysql: destructive-only-to-lit_* integration checks against a disposable or explicitly selected MySQL server",
    "qdrant: integration checks against a running Qdrant server (RUN_QDRANT_INTEGRATION=1)",
]
