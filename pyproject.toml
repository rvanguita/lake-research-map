[project]
name = "lake-research-map"
version = "0.1.0"
description = "Medallion data lake and analytical research platform turning IEEE Xplore and Elsevier bibliographic exports into a deduplicated, RAG-ready literature corpus"
readme = "README.md"
authors = [
    { name = "Rene", email = "renevajr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.1",
    "fastembed>=0.8.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pymysql>=1.2.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.53",
    "statsmodels>=0.14.5",
    "streamlit>=1.63.0",
]

[project.scripts]
lake-research-map = "lake_research_map:main"
lake-literature = "lake_research_map:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Dashboard pages carry long human-readable Portuguese UI strings/captions;
# enforcing a hard wrap on those hurts readability more than it helps.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
