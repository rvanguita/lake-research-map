services:
  # The read-only dashboard. The pipeline does not run in a container: it runs
  # from the repository with `uv run lake-research-map ...` (ADR-09).
  dashboard:
    build: .
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    # No `env_file`: the read-only dashboard gets only the variables it reads
    # (config.py, apps/dashboard, apps/api, transform/embeddings.py), never the
    # OpenAlex/Crossref contacts or anything else .env holds. A bare name passes
    # the value from the shell or .env when it is set and leaves it unset
    # otherwise, so the code's own default applies -- `${VAR:-}` would set it to
    # "" instead, which int() rejects (QDRANT_TIMEOUT, the year overrides) and
    # which would replace a pinned model revision with nothing.
    environment:
      # The container reuses .env's MYSQL_HOST when it names a LAN/remote server.
      # When MySQL runs on this host, that value is 127.0.0.1 -- which inside the
      # container is the container itself -- so set DASHBOARD_MYSQL_HOST to
      # host.docker.internal (the host, via `extra_hosts` below; MySQL must then
      # listen on the docker bridge address). DASHBOARD_MYSQL_HOST always wins.
      MYSQL_HOST: ${DASHBOARD_MYSQL_HOST:-${MYSQL_HOST:-host.docker.internal}}
      MYSQL_PORT:
      MYSQL_USER:
      MYSQL_PASSWORD:
      # inside the compose network the vector store is reachable by name;
      # .env's own QDRANT_URL is the host's (ADR-08)
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY:
      QDRANT_TIMEOUT:
      LAKE_RESEARCH_MAP_COMPLETE_YEAR:
      LAKE_RESEARCH_MAP_CITATION_OBSERVATION_YEAR:
      # the query embedder and the reranker are pinned like the pipeline's
      LAKE_RESEARCH_MAP_EMBED_REVISION:
      LAKE_RESEARCH_MAP_EMBED_CONTENT_SHA256:
      LAKE_RESEARCH_MAP_EMBED_THREADS:
      LAKE_RESEARCH_MAP_RERANK_REVISION:
      LAKE_RESEARCH_MAP_RERANK_CONTENT_SHA256:
      # fastembed's default cache is under /tmp: a fresh container would
      # re-download the models on every start
      FASTEMBED_CACHE_PATH: /opt/model-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model_cache:/opt/model-cache
    depends_on:
      # `required: false` keeps `docker compose up -d` working without the
      # `qdrant` profile; dense search then degrades to lexical with a warning
      qdrant:
        condition: service_healthy
        required: false
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g

  # The vector store (ADR-08): one immutable collection per Gold dataset
  # version plus the `lit_chunks_active` alias external RAG clients query.
  # Opt-in profile: `docker compose --profile qdrant up -d` (or
  # COMPOSE_PROFILES=qdrant in .env). The embed and semantic stages,
  # publication and dense search need it running.
  qdrant:
    # Pinned to the qdrant-client minor in uv.lock (1.20); move both together.
    image: qdrant/qdrant:v1.20.0
    profiles: ["qdrant"]
    ports:
      # loopback only: payloads carry chunk text, including PDF full text
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # the image ships no curl/wget; bash's /dev/tcp is enough to see the
      # REST port accept connections
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g

volumes:
  model_cache:
  qdrant_storage:
