services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      # inside the compose network the airflow service is reachable by name;
      # .env's own AIRFLOW_BASE_URL covers running streamlit on the host instead
      AIRFLOW_BASE_URL: http://airflow:8080
      LAKE_RESEARCH_MAP_DB_ROLE: dashboard
    depends_on:
      - airflow
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: ["standalone"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # single-user local setup: GET /auth/token with no credentials returns
      # a valid admin JWT, so the dashboard never needs to manage a password
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # the installed PyJWT rejects a non-string `iss` claim, and Airflow's
      # default `api_auth.jwt_issuer` is unset (None) -- without this, every
      # /auth/token (and therefore every dashboard Airflow call) 500s with
      # "Issuer (iss) must be a string."
      AIRFLOW__API_AUTH__JWT_ISSUER: lake-research-map
      # keep this container's uv-managed venv separate from the host's .venv
      # (its own activation scripts embed host-specific absolute paths)
      UV_PROJECT_ENVIRONMENT: /opt/venv-airflow
      LAKE_RESEARCH_MAP_DB_ROLE: pipeline
    volumes:
      - airflow_home:/opt/airflow
      - airflow_venv:/opt/venv-airflow
      - ./src:/opt/airflow/project/src
      - ./main.py:/opt/airflow/project/main.py
      - ./pyproject.toml:/opt/airflow/project/pyproject.toml
      - ./uv.lock:/opt/airflow/project/uv.lock
      - ./README.md:/opt/airflow/project/README.md
      - ./data:/opt/airflow/project/data
      - ./airflow/dags:/opt/airflow/project/airflow/dags
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g

volumes:
  airflow_home:
  airflow_venv:
