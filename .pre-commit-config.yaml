repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-docs-on-main
        name: Block documentation-only commits on main
        entry: uv run python -m devtools.docs_branch_guard
        language: system
        pass_filenames: false
        always_run: true
