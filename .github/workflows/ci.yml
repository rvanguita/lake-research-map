name: CI

# The default suite needs no service and no corpus: it runs against in-memory
# SQLite and qdrant-client's local mode, and `data/` (git-ignored) never exists
# in a checkout. The `mysql` tests skip without RUN_MYSQL_INTEGRATION=1.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the action scans the pushed commit range, which needs the history
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Server-only Qdrant behaviour (payload indexes, exact search) that local mode
  # ignores. Informational: not a required check.
  qdrant:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      qdrant:
        # pinned to the qdrant-client minor in uv.lock, like docker-compose.yml
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          exit 1
      - run: uv run pytest -m qdrant -q -p no:cacheprovider
        env:
          RUN_QDRANT_INTEGRATION: "1"
          QDRANT_URL: http://localhost:6333
