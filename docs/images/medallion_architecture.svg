<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Outer Canvas Border -->
  <rect x="12" y="12" width="1176" height="676" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== HEADER ==================== -->
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.3">lake-research-map: Medallion Architecture &amp; Analytical Pipeline</text>
  <text x="600" y="62" text-anchor="middle" font-size="12.5" font-weight="500" fill="#64748b">Production Data Lake &amp; Scientometric Platform for Systematic Literature Review on Distribution System Planning</text>

  <!-- ==================== SOURCES LAYER ==================== -->
  <!-- IEEE Xplore -->
  <g filter="url(#shadow)">
    <rect x="50" y="78" width="310" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="62" y="88" width="36" height="38" rx="6" fill="#0284c7" opacity="0.12"/>
    <text x="80" y="112" text-anchor="middle" font-size="16">📄</text>
    <text x="110" y="101" font-size="14" font-weight="700" fill="#0f172a">IEEE Xplore</text>
    <text x="110" y="120" font-size="11" fill="#475569">CSV metadata exports (authoritative), .bib, PDFs</text>
  </g>

  <!-- OpenAlex REST API -->
  <g filter="url(#shadow)">
    <rect x="445" y="78" width="310" height="58" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="457" y="88" width="36" height="38" rx="6" fill="#16a34a" opacity="0.12"/>
    <text x="475" y="112" text-anchor="middle" font-size="16">🌐</text>
    <text x="505" y="101" font-size="14" font-weight="700" fill="#15803d">OpenAlex REST API</text>
    <text x="505" y="120" font-size="11" fill="#166534">Automated citation &amp; reference count enrichment</text>
  </g>

  <!-- Elsevier / ScienceDirect -->
  <g filter="url(#shadow)">
    <rect x="840" y="78" width="310" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="852" y="88" width="36" height="38" rx="6" fill="#ea580c" opacity="0.12"/>
    <text x="870" y="112" text-anchor="middle" font-size="16">📚</text>
    <text x="900" y="101" font-size="14" font-weight="700" fill="#0f172a">Elsevier / ScienceDirect</text>
    <text x="900" y="120" font-size="11" fill="#475569">BibTeX bibliographic search exports</text>
  </g>

  <!-- Source Ingestion Flow Arrows -->
  <path d="M205,136 L205,158 L125,158 L125,178" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600,136 L600,158 L315,158 L315,178" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M995,136 L995,158 L125,158" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- ==================== MEDALLION PIPELINE (6 STAGES) ==================== -->

  <!-- STAGE 1: RAW -->
  <g filter="url(#shadow)">
    <rect x="41" y="180" width="168" height="175" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <path d="M42,181 L208,181 A7,7 0 0 1 208,212 L42,212 Z" fill="#d1fae5"/>
    <text x="125" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">1. RAW</text>
    <text x="125" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">Verbatim Ingest</text>
    <text x="54" y="248" font-size="10.5" fill="#065f46">• SHA-256 manifest</text>
    <text x="54" y="265" font-size="10.5" fill="#065f46">• Raw CSV, .bib &amp; PDFs</text>
    <text x="54" y="282" font-size="10.5" fill="#065f46">• Zero data mutation</text>
    <text x="54" y="299" font-size="10.5" fill="#065f46">• Exact source history</text>
    <!-- Table Badge -->
    <rect x="52" y="318" width="146" height="24" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1"/>
    <text x="125" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#064e3b">lit_source_files • 5 tables</text>
  </g>

  <!-- Arrow Raw -> Bronze -->
  <path d="M209,267 L229,267" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- STAGE 2: BRONZE -->
  <g filter="url(#shadow)">
    <rect x="231" y="180" width="168" height="175" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M232,181 L398,181 A7,7 0 0 1 398,212 L232,212 Z" fill="#fef3c7"/>
    <text x="315" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">2. BRONZE</text>
    <text x="315" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Harmonization</text>
    <text x="244" y="248" font-size="10.5" fill="#92400e">• Typed article union</text>
    <text x="244" y="265" font-size="10.5" fill="#92400e">• Natural key upsert</text>
    <text x="244" y="282" font-size="10.5" fill="#92400e">• Pagination dedup</text>
    <text x="244" y="299" font-size="10.5" fill="#92400e">• OpenAlex citation backfill</text>
    <!-- Table Badge -->
    <rect x="242" y="318" width="146" height="24" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <text x="315" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">lit_articles (unioned)</text>
  </g>

  <!-- Arrow Bronze -> Silver -->
  <path d="M399,267 L419,267" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- STAGE 3: SILVER -->
  <g filter="url(#shadow)">
    <rect x="421" y="180" width="168" height="175" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M422,181 L588,181 A7,7 0 0 1 588,212 L422,212 Z" fill="#dbeafe"/>
    <text x="505" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#1e40af">3. SILVER</text>
    <text x="505" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Clean &amp; Deduplicate</text>
    <text x="434" y="248" font-size="10.5" fill="#1e40af">• Normalized DOI dedup</text>
    <text x="434" y="265" font-size="10.5" fill="#1e40af">• Quality &amp; is_non_article</text>
    <text x="434" y="282" font-size="10.5" fill="#1e40af">• Fuzzy PDF match ≥85%</text>
    <text x="434" y="299" font-size="10.5" fill="#1e40af">• SLR audit: lit_rejected</text>
    <!-- Table Badge -->
    <rect x="432" y="318" width="146" height="24" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <text x="505" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">lit_articles • lit_rejected</text>
  </g>

  <!-- Arrow Silver -> Gold -->
  <path d="M589,267 L609,267" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- STAGE 4: GOLD -->
  <g filter="url(#shadow)">
    <rect x="611" y="180" width="168" height="175" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <path d="M612,181 L778,181 A7,7 0 0 1 778,212 L612,212 Z" fill="#ffe4e6"/>
    <text x="695" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#9f1239">4. GOLD</text>
    <text x="695" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#be123c">Curated RAG Units</text>
    <text x="624" y="248" font-size="10.5" fill="#9f1239">• Curated papers (1,831)</text>
    <text x="624" y="265" font-size="10.5" fill="#9f1239">• Reconciled chunks</text>
    <text x="624" y="282" font-size="10.5" fill="#9f1239">• Abstract + full-text RAG</text>
    <text x="624" y="299" font-size="10.5" fill="#9f1239">• lit_pipeline_runs trace</text>
    <!-- Table Badge -->
    <rect x="622" y="318" width="146" height="24" rx="4" fill="#fecdd3" stroke="#e11d48" stroke-width="1"/>
    <text x="695" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#881337">lit_articles • lit_chunks</text>
  </g>

  <!-- Arrow Gold -> Embed -->
  <path d="M779,267 L799,267" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- STAGE 5: EMBED -->
  <g filter="url(#shadow)">
    <rect x="801" y="180" width="168" height="175" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M802,181 L968,181 A7,7 0 0 1 968,212 L802,212 Z" fill="#ede9fe"/>
    <text x="885" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#5b21b6">5. EMBED</text>
    <text x="885" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Vector Inference</text>
    <text x="814" y="248" font-size="10.5" fill="#5b21b6">• Local FastEmbed ONNX</text>
    <text x="814" y="265" font-size="10.5" fill="#5b21b6">• BAAI/bge-small-en-v1.5</text>
    <text x="814" y="282" font-size="10.5" fill="#5b21b6">• 384 dimensions</text>
    <text x="814" y="299" font-size="10.5" fill="#5b21b6">• Zero API dependency</text>
    <!-- Table Badge -->
    <rect x="812" y="318" width="146" height="24" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="885" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">embedding_bin (float32)</text>
  </g>

  <!-- Arrow Embed -> Semantic -->
  <path d="M969,267 L989,267" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- STAGE 6: SEMANTIC -->
  <g filter="url(#shadow)">
    <rect x="991" y="180" width="168" height="175" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <path d="M992,181 L1158,181 A7,7 0 0 1 1158,212 L992,212 Z" fill="#e0f2fe"/>
    <text x="1075" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">6. SEMANTIC</text>
    <text x="1075" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0284c7">Relevance &amp; Maps</text>
    <text x="1004" y="248" font-size="10.5" fill="#0369a1">• Contrastive margin cut</text>
    <text x="1004" y="265" font-size="10.5" fill="#0369a1">• KMeans 8 cluster themes</text>
    <text x="1004" y="282" font-size="10.5" fill="#0369a1">• PCA-50 + t-SNE / UMAP</text>
    <text x="1004" y="299" font-size="10.5" fill="#0369a1">• Near-duplicate detection</text>
    <!-- Table Badge -->
    <rect x="1002" y="318" width="146" height="24" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
    <text x="1075" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#075985">lit_semantics • pairs</text>
  </g>

  <!-- ==================== ORCHESTRATION LAYER ==================== -->
  <g>
    <!-- Orchestration Bracket & Container -->
    <rect x="41" y="370" width="1118" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
    <!-- Stage indicator marks -->
    <circle cx="125" cy="370" r="3" fill="#10b981"/>
    <circle cx="315" cy="370" r="3" fill="#f59e0b"/>
    <circle cx="505" cy="370" r="3" fill="#3b82f6"/>
    <circle cx="695" cy="370" r="3" fill="#f43f5e"/>
    <circle cx="885" cy="370" r="3" fill="#8b5cf6"/>
    <circle cx="1075" cy="370" r="3" fill="#0ea5e9"/>

    <text x="600" y="391" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">
      ⚙️ Apache Airflow 3.x Orchestration — 6 Stage DAGs + 1 Chained Master Flow (<tspan font-family="monospace" font-size="11">airflow/dags/lake_research_map_dags.py</tspan>)
    </text>
    <text x="600" y="408" text-anchor="middle" font-size="11" fill="#64748b">
      Dual execution paths: <tspan font-family="monospace" font-weight="600">uv run lake-research-map --stage &lt;stage&gt;</tspan> (CLI) • Interactive DAG triggers via Airflow REST API
    </text>
  </g>

  <!-- Flow Downward to Dashboard -->
  <path d="M600,420 L600,448" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ==================== DASHBOARD LAYER (10 PAGES) ==================== -->
  <g filter="url(#shadow)">
